<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>RustWeather</title>
  <!-- A radar screen on a light tile, in the icon style of RustView, RustCut and RustKnown: their background gradient, a
       light tile and one orange symbol with a dark halo. Only plain shapes, strokes and gradients, so every SVG renderer
       (librsvg, Qt, resvg) draws it the same. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3340"/><stop offset="1" stop-color="#171a21"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c3cbda"/></linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="16" y="16" width="96" height="96" rx="14" fill="url(#tile)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#222630">
      <circle cx="64" cy="64" r="36" stroke-width="13"/>
      <path d="M64 64L88 37" stroke-width="13"/>
      <path d="M64 64A0 0 0 0 1 64 64" stroke-width="20"/>
    </g>
    <g stroke="#ff7a2f">
      <circle cx="64" cy="64" r="36" stroke-width="8"/>
      <path d="M64 64L88 37" stroke-width="8"/>
    </g>
  </g>
  <path d="M64 64L64 28A36 36 0 0 1 88 37Z" fill="#ff7a2f" fill-opacity="0.55"/>
  <circle cx="64" cy="64" r="11" fill="#222630"/>
  <circle cx="64" cy="64" r="7" fill="#ff7a2f"/>
  <circle cx="44" cy="76" r="9" fill="#222630"/>
  <circle cx="44" cy="76" r="5.5" fill="#ff7a2f"/>
  <circle cx="82" cy="78" r="7.5" fill="#222630"/>
  <circle cx="82" cy="78" r="4.2" fill="#ff7a2f"/>
</svg>
